[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vista"
version = "0.1.0"
description = "VISTA: privacy-preserving receiver-verifiable security-control attestation for real-time payments (research artifact)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "cryptography>=42",
  "matplotlib>=3.8",
  "gmpy2>=2.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
vista-run = "vista.run_all:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
